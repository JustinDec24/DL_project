project_name: harmeme_crossattn

dataset:
  type: harmeme
  root_dir: C:/Users/decju/OneDrive/Bureau/meme/mmf/data/datasets/memes/defaults
  fine_grained: false
  strict_images: true

task:
  num_classes: 2
  class_names:
    - not_harmful
    - harmful

model:
  clip_model: openai/clip-vit-base-patch32
  text_model: GroNLP/hateBERT
  max_length: 77
  dropout: 0.1
  freeze_encoders: true
  unfreeze_last_n_layers: 2
  n_fusion_layers: 2
  fusion_num_heads: 8

training:
  batch_size: 32
  learning_rate: 1e-4
  encoder_lr_multiplier: 0.1
  epochs: 15
  weight_decay: 0.01
  warmup_ratio: 0.06
  max_grad_norm: 1.0
  use_focal_loss: false

paths:
  results_dir: results/harmeme_crossattn

experiment:
  seed: 42
