project_name: hateful_memes_crossattn

dataset:
  hf_name: limjiayi/hateful_memes_expanded
  train_split: train
  val_split: validation
  test_split: test
  local_img_dir: null            # set to local Hateful Memes folder (containing img/*.png)
  strict_images: true

task:
  num_classes: 2
  class_names:
    - not_hateful
    - hateful

model:
  clip_model: openai/clip-vit-base-patch32
  text_model: GroNLP/hateBERT
  max_length: 77
  dropout: 0.1
  freeze_encoders: true
  unfreeze_last_n_layers: 2
  n_fusion_layers: 2          # 2 bidirectional cross-attention blocks
  fusion_num_heads: 8

training:
  batch_size: 32
  learning_rate: 1e-4           # head + fusion LR
  encoder_lr_multiplier: 0.1    # encoder LR = 1e-5
  epochs: 15
  weight_decay: 0.01
  warmup_ratio: 0.06
  max_grad_norm: 1.0
  use_focal_loss: false

paths:
  results_dir: results/memes_crossattn

experiment:
  seed: 42
